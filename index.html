<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}*{box-sizing:border-box}[hidden]{display:none!important}</style>
<title>블루 챔피언 카드팩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen stage — header, center stage (pack → card stack → result fan), hint line. Deliberately single dark theme (card-opening arena). */
:root{
  --bg:#050f26; --bg2:#0c2a68; --blue:#1f6bff; --ice:#d6e4ff; --fg:#f3f7ff; --muted:#8ea6d6;
  --gold:#ffcf4a; --pink:#ff7ad9; --line:rgba(160,190,255,.22);
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --num:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --cw:min(76vw,320px,56vh);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(120% 70% at 50% -5%,var(--bg2),var(--bg) 68%);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px;box-sizing:border-box}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:60}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--num);font-size:24px;letter-spacing:.06em;font-weight:400}
.brand span{font-size:11px;color:var(--muted);margin-top:3px}
.hbtns{display:flex;gap:6px}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="false"]{color:var(--muted)}
#stage{flex:1;position:relative;touch-action:none;min-height:0}
#hint{text-align:center;font-size:13px;color:var(--ice);min-height:22px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:5}
#hint .arrow{display:inline-block;animation:nudge 1.1s ease-in-out infinite}
#counter{font-family:var(--num);font-size:18px;letter-spacing:.08em;color:var(--muted)}
.note{text-align:center;font-size:10.5px;color:var(--muted);opacity:.75;margin-top:2px}
@keyframes nudge{0%,100%{transform:translateX(-4px)}50%{transform:translateX(6px)}}
@keyframes nudgeUp{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}

/* ---------- pack ---------- */
.pack-wrap{position:absolute;inset:0;display:grid;place-items:center}
.pack{position:relative;width:min(64vw,270px,42vh);aspect-ratio:5/8;cursor:grab;touch-action:none;container-type:inline-size;filter:drop-shadow(0 26px 34px rgba(0,0,0,.55));animation:float 3.4s ease-in-out infinite}
.pack.drop{animation:none;transition:transform .55s cubic-bezier(.6,0,.85,.35),opacity .55s;transform:translateY(75vh) rotate(5deg);opacity:0}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.foilbg{background:linear-gradient(140deg,#0a2a74 0%,#1f6bff 30%,#0b1f57 52%,#2f80ff 76%,#0a2a74 100%)}
.pack-body,.pack-top{position:absolute;left:0;right:0;overflow:hidden}
.pack-body{top:15%;bottom:0;border-radius:0 0 7px 7px}
.pack-top{top:0;height:15.4%;border-radius:7px 7px 0 0;z-index:3;transform-origin:100% 100%}
.pack-top.snap{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pack-top.fly{transition:transform .75s cubic-bezier(.15,.7,.3,1),opacity .75s;transform:translate(calc(var(--dir)*95vw),-38vh) rotate(calc(var(--dir)*75deg))!important;opacity:0}
.crimp{position:absolute;left:0;right:0;height:9%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,rgba(0,0,0,.18) 2px 5px)}
.pack-top .crimp{top:0;height:42%}
.pack-body .crimp{bottom:0;height:5%}
.seam{position:absolute;left:4%;right:4%;bottom:6%;border-bottom:1.5px dashed rgba(255,255,255,.55)}
.tearhere{position:absolute;right:5%;bottom:16%;font-family:var(--num);font-size:6.5cqw;letter-spacing:.12em;color:rgba(255,255,255,.85)}
.tear{position:absolute;bottom:0;height:5px;width:0;background:linear-gradient(90deg,#fff,#ffe9a8);box-shadow:0 0 10px 3px rgba(255,230,160,.9),0 0 26px 8px rgba(120,170,255,.6);border-radius:3px}
.sheen{position:absolute;inset:-10%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.42) 49%,rgba(255,255,255,.1) 53%,transparent 62%);background-size:260% 100%;animation:sheen 3.6s ease-in-out infinite;mix-blend-mode:overlay;pointer-events:none}
@keyframes sheen{0%{background-position:130% 0}60%,100%{background-position:-30% 0}}
.pk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8cqw 6cqw}
.pk-water{position:absolute;font-family:var(--num);font-size:92cqw;line-height:.8;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.14);top:6%;left:50%;transform:translateX(-50%)}
.pk-season{font-family:var(--num);font-size:7cqw;letter-spacing:.3em;color:var(--ice);position:relative}
.pk-title{font-family:var(--num);font-size:21cqw;line-height:.9;white-space:nowrap;margin-top:2cqw;letter-spacing:.02em;position:relative;background:linear-gradient(180deg,#fff 30%,#bcd3ff 60%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,20,80,.6))}
.pk-ko{font-family:var(--display);font-size:9cqw;margin-top:3cqw;position:relative;letter-spacing:.02em}
.pk-stars{margin-top:5cqw;display:flex;gap:1.6cqw;position:relative}
.pk-stars i{width:5.4cqw;height:5.4cqw;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.pk-foot{position:absolute;bottom:9%;left:0;right:0;text-align:center;font-size:4.6cqw;color:var(--ice);font-weight:700;letter-spacing:.02em}

/* ---------- cards ---------- */
#deck{position:absolute;inset:0;pointer-events:none}
.card{position:absolute;left:50%;top:50%;width:var(--cw);aspect-ratio:5/7;margin-left:calc(var(--cw)/-2);margin-top:calc(var(--cw)*-.7);perspective:1100px;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;touch-action:none}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out;animation:rise .7s cubic-bezier(.2,.9,.25,1.15) backwards}
@keyframes rise{from{transform:translateY(55vh) scale(.6) rotate(6deg);opacity:0}}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.25,1.35,.45,1)}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:5%/3.6%;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.front{transform:rotateY(180deg)}
.back{background:#0a1c4a;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 10px,transparent 10px 20px),radial-gradient(circle at 50% 45%,#1d4fc4,#0a1c4a 70%);border:3px solid #2a5bd6;box-sizing:border-box;display:grid;place-items:center;container-type:inline-size}
.back-in{display:flex;flex-direction:column;align-items:center;gap:3cqw;color:var(--ice)}
.back svg{width:44cqw;height:44cqw}
.back-t{font-family:var(--num);font-size:13cqw;letter-spacing:.1em;line-height:1}
.back-s{font-size:3.6cqw;letter-spacing:.2em;color:var(--muted)}
.card.top .back.g-S{animation:glowS 1.3s ease-in-out infinite}
.card.top .back.g-A{animation:glowA 1.6s ease-in-out infinite}
.card.top .back.g-B{box-shadow:0 0 18px 2px rgba(143,180,255,.45)}
@keyframes glowS{0%,100%{box-shadow:0 0 22px 4px rgba(255,122,217,.7),0 0 60px 14px rgba(120,200,255,.35);border-color:#ff9be6}50%{box-shadow:0 0 34px 10px rgba(255,210,110,.85),0 0 90px 24px rgba(255,122,217,.45);border-color:#ffe08a}}
@keyframes glowA{0%,100%{box-shadow:0 0 18px 3px rgba(255,207,74,.55)}50%{box-shadow:0 0 30px 8px rgba(255,207,74,.85)}}
.card.charge .tilt{animation:jitter .07s linear infinite}
.card.charge .back{box-shadow:0 0 40px 14px var(--rk),0 0 120px 40px var(--rk)!important;border-color:#fff!important}
@keyframes jitter{0%{transform:translate(1px,-1px) rotate(.4deg)}50%{transform:translate(-2px,1px) rotate(-.6deg)}100%{transform:translate(1px,1px) rotate(.3deg)}}

/* card face (shared by deck, result fan, dex, zoom) */
.cf{position:absolute;inset:0;border:3px solid transparent;border-radius:5%/3.6%;box-sizing:border-box;container-type:inline-size;display:grid;grid-template-rows:auto 1fr auto auto auto;gap:2.6cqw;padding:4.5cqw;overflow:hidden;--mx:50%;--my:50%;
  background:var(--face) padding-box,var(--frame) border-box}
.r-S{--face:linear-gradient(160deg,#1b1257,#0b2a66 48%,#3b1257);--frame:conic-gradient(from 0deg,#ff7ad9,#ffd36e,#7effc6,#7ec8ff,#c69bff,#ff7ad9)}
.r-A{--face:linear-gradient(165deg,#0f2f70,#081a42);--frame:linear-gradient(135deg,#fff3b8,#ffcf4a 30%,#a8761b 55%,#ffe58a 80%,#b9862a)}
.r-B{--face:linear-gradient(165deg,#164089,#0a2252);--frame:linear-gradient(135deg,#d9e6ff,#8fb4ff 45%,#4d6fae)}
.r-C{--face:linear-gradient(165deg,#2b3b5a,#18233b);--frame:linear-gradient(135deg,#9aa6bd,#5e6a82)}
.cf-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.badge{width:14cqw;height:14cqw;display:grid;place-items:center;font-family:var(--num);font-size:12cqw;line-height:1;padding-top:1cqw;box-sizing:border-box;border-radius:3cqw;background:rgba(0,0,0,.32);border:1.5px solid var(--rk);color:var(--rk)}
.r-S .badge{color:#fff;background:linear-gradient(135deg,#ff7ad9,#ffd36e,#7ec8ff);border-color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ovr{display:flex;align-items:baseline;gap:1.4cqw}
.ovr span{font-size:3.4cqw;font-weight:700;color:var(--muted);letter-spacing:.1em}
.ovr b{font-family:var(--num);font-weight:400;font-size:13cqw;line-height:.9;color:#fff}
.art{position:relative;border-radius:3cqw;overflow:hidden;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);min-height:0}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(-55deg,transparent 0 7cqw,color-mix(in srgb,var(--rk) 16%,transparent) 7cqw 8.5cqw)}
.bignum{position:absolute;right:2cqw;bottom:-4cqw;font-family:var(--num);font-size:46cqw;letter-spacing:-.01em;line-height:1;background:linear-gradient(170deg,#ffffff 10%,var(--rk) 55%,rgba(255,255,255,.15) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.jersey{position:absolute;left:8%;right:8%;top:10%;bottom:4%;width:84%;height:86%;filter:drop-shadow(0 2cqw 2.4cqw rgba(0,0,0,.45))}
.j-body{fill:#1f5fe0;stroke:#ffffff;stroke-width:3;stroke-linejoin:round}
.r-S .j-body{fill:#2a63e8}
.j-shade{fill:rgba(0,10,50,.18)}
.j-trim{fill:none;stroke:var(--rk);stroke-width:5;stroke-linecap:round}
.r-C .j-trim{stroke:#ffffff}
.j-name{font-family:var(--display);font-size:17px;fill:#fff;text-anchor:middle;letter-spacing:.5px}
.j-num{font-family:var(--num);font-size:82px;fill:#fff;stroke:#0a2a74;stroke-width:3;paint-order:stroke;text-anchor:middle}
.titles{position:absolute;left:3cqw;bottom:3cqw;display:flex;flex-wrap:wrap;gap:1.4cqw;z-index:2;max-width:94%}
.titles span{font-size:3.4cqw;font-weight:900;color:#2a1a00;background:linear-gradient(135deg,#fff3b8,#ffcf4a 55%,#e0a92c);padding:1cqw 2.4cqw;border-radius:99px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pos{position:absolute;left:3cqw;top:3cqw;font-size:3.6cqw;font-weight:900;background:var(--rk);color:#0a1430;padding:1cqw 2.4cqw;border-radius:99px}
.yr{position:absolute;left:3.4cqw;bottom:2.6cqw;font-family:var(--num);font-size:6cqw;letter-spacing:.14em;color:rgba(255,255,255,.75)}
.nm{position:relative;z-index:2}
.name{font-family:var(--display);font-size:10.5cqw;line-height:1.05;letter-spacing:.01em}
.sub{font-size:3.4cqw;color:var(--muted);margin-top:1cqw;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;position:relative;z-index:2}
.st{background:rgba(0,0,0,.28);border-radius:2.4cqw;padding:1.8cqw 1cqw 1.4cqw;text-align:center;display:flex;flex-direction:column;gap:.6cqw}
.st b{font-family:var(--num);font-weight:400;font-size:8.6cqw;line-height:1;font-variant-numeric:tabular-nums}
.st span{font-size:3cqw;color:var(--muted);font-weight:700}
.foot{font-size:3.3cqw;line-height:1.35;color:var(--ice);position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.12);padding-top:2cqw}
.holo,.glare{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit}
.r-S .holo{background:repeating-linear-gradient(115deg,#ff7ab3 0%,#ffd36e 7%,#7effc6 14%,#7ec8ff 21%,#c69bff 28%,#ff7ab3 35%);background-size:280% 280%;background-position:var(--mx) var(--my);mix-blend-mode:color-dodge;opacity:.42}
.r-A .holo{background:linear-gradient(115deg,transparent 30%,rgba(255,226,140,.55) 45%,rgba(255,255,255,.4) 50%,rgba(255,226,140,.5) 55%,transparent 70%);background-size:250% 250%;background-position:var(--mx) var(--my);mix-blend-mode:overlay}
.glare{background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.38),transparent 45%);mix-blend-mode:overlay}
.r-C .glare{opacity:.5}

/* ---------- result ---------- */
#result{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20}
#result h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;text-wrap:balance;text-align:center}
#result .best{font-size:13px;color:var(--muted);margin-top:-8px;text-align:center}
.fan{position:relative;width:100%;height:calc(min(28vw,124px) * 1.4 + 30px)}
.mini{position:absolute;left:50%;top:6px;width:min(28vw,124px);aspect-ratio:5/7;margin-left:calc(min(28vw,124px)/-2);transform-origin:50% 120%;animation:deal .6s cubic-bezier(.2,.9,.3,1.2) backwards;cursor:pointer;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));background:none;border:0;padding:0}
@keyframes deal{from{transform:translateY(40vh) rotate(0);opacity:0}}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border-radius:14px;padding:14px 22px;font-weight:900;font-size:15px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.btn.primary{background:linear-gradient(180deg,#3d86ff,#1f5fe0);border-color:#7fb0ff;box-shadow:0 6px 20px rgba(31,107,255,.45)}
.btn:active{transform:scale(.97)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(3,10,28,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;flex-direction:column;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.ov-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ov-head h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.ov-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.dexgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;overflow-y:auto;padding-bottom:20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.dexitem{position:relative;aspect-ratio:5/7;background:none;border:0;padding:0}
.dexitem.locked{border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-family:var(--num);font-size:34px;background:rgba(255,255,255,.03)}
.cnt{position:absolute;right:4px;bottom:4px;z-index:5;background:rgba(0,0,0,.7);font-size:11px;font-weight:900;border-radius:99px;padding:2px 7px}
#zoom{align-items:center;justify-content:center;gap:16px}
#zoomcard{position:relative;width:var(--cw);aspect-ratio:5/7;transition:transform .2s ease-out;touch-action:none}
#zoom p{font-size:12px;color:var(--muted);margin:0}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#flash{position:fixed;inset:0;pointer-events:none;z-index:69;opacity:0}

@media (prefers-reduced-motion: reduce){
  .pack,.sheen,#hint .arrow{animation:none}
  .card.charge .tilt{animation:none}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand"><b>CHAMPIONS PACK</b><span>2026 우승 기념 선수 카드</span></div>
    <div class="hbtns">
      <button class="chip" id="soundBtn" aria-pressed="true">소리 켬</button>
      <button class="chip" id="dexBtn">도감 0/12</button>
    </div>
  </header>

  <div id="stage">
    <div class="pack-wrap" id="packWrap">
      <div class="pack" id="pack" role="button" aria-label="카드팩, 옆으로 밀어서 찢기">
        <div class="pack-body foilbg">
          <div class="pk">
            <div class="pk-water">26</div>
            <div class="pk-season">SEASON 2026</div>
            <div class="pk-title">CHAMPIONS</div>
            <div class="pk-ko">통산 9번째 우승 기념</div>
            <div class="pk-stars" aria-label="통산 우승 9회"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="pk-foot">랜덤 5장 · S등급 확률 7%</div>
          <div class="crimp"></div>
          <div class="sheen"></div>
        </div>
        <div class="pack-top foilbg" id="packTop">
          <div class="crimp"></div>
          <div class="tearhere">TEAR HERE ▸</div>
          <div class="seam"></div>
          <div class="sheen"></div>
          <div class="tear" id="tear"></div>
        </div>
      </div>
    </div>
    <div id="deck"></div>
    <div id="result" hidden></div>
  </div>

  <div id="hint"><span id="counter"></span><span id="hintText">팩 윗부분을 옆으로 쭉 밀어서 찢기</span><span class="arrow" id="hintArrow">→</span></div>
  <div class="note">2026 정규시즌 기록 · 등급과 OVR은 재미로 매긴 점수</div>
</div>

<div class="overlay" id="dex" hidden>
  <div class="ov-head"><div><h3>내 도감</h3><p id="dexSub"></p></div><button class="chip" id="dexClose">닫기</button></div>
  <div class="dexgrid" id="dexGrid"></div>
</div>
<div class="overlay" id="zoom" hidden>
  <div id="zoomcard"></div>
  <p>카드를 문질러 보세요 · 바깥을 탭하면 닫혀요</p>
</div>

<canvas id="fx"></canvas>
<div id="flash"></div>

<script>
(() => {
'use strict';
// ---------- data: 2026 정규시즌 1군 출전 전원 (KBO 기록실 기준) ----------
// 타자: [이름, 포지션, 경기, 타석, 득점, 안타, 홈런, 타점, 타율, OPS, 구분표기]
const BAT = [
  ['구자욱','좌익수',114,497,88,156,15,102,'.371','1.039'],
  ['디아즈','1루수',144,625,86,165,26,129,'.305','.894'],
  ['최형우','지명타자',137,574,61,148,18,106,'.301','.849'],

function audio(){

function noise(dur, freq, vol, q=1.2){
  const a=audio(); if(!a) return;
  const len=Math.floor(a.sampleRate*dur), buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=a.createGain(); g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
function tone(freq, dur, vol=.12, type='triangle', delay=0, to){
  const a=audio(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);
}

function burst(x,y,colors,n,o={}){
  if(reduce) n=Math.ceil(n/4);
  const sp=o.speed||9;
  for(let i=0;i<n;i++){
    const a=o.angle!=null ? o.angle+(Math.random()-.5)*(o.spread||1) : Math.random()*Math.PI*2;
    const v=sp*(.35+Math.random()*.9);

  }

function tick(){
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life<p.max);
  for(const p of parts){
    p.life++; p.vx*=.97; p.vy=p.vy*.97+p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    const al=1-p.life/p.max; cx.globalAlpha=al; cx.fillStyle=p.c; cx.strokeStyle=p.c;
    if(p.k==='spark'){ cx.lineWidth=2; cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2); cx.stroke(); }

  }

}

  setTear(p);
  if(p<drag.lastTick-.1) drag.lastTick=p;
  if(p-drag.lastTick>.07){
    drag.lastTick=p; sfx.tick(); vib(8);
    const r=packTop.getBoundingClientRect();
    const tx = drag.dir>0 ? r.left+p*r.width : r.right-p*r.width;
    burst(tx, r.bottom, ['#ffffff','#bcd3ff','#ffe9a8'], 3, {speed:4, size:5, g:.3, life:40, lift:2});
  }
  if(p>=1) openPack();
});
const endDrag = () => {
  if(!drag || state!=='pack') { drag=null; return; }
  const flick = drag.axis==='x' && drag.p>.18 && Math.abs(drag.vx)>.5 && Math.sign(drag.vx)===drag.dir;
  if(drag.axis==='x' && (drag.p>.45 || flick)) openPack();
  else { packTop.classList.add('snap'); setTear(0); drag=null; }
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
function setTear(p){
  if(drag) drag.p=p;
  const dir=drag&&drag.dir||1;
  packTop.style.transform=`translateY(${-p*7}px) rotate(${dir*p*13}deg)`;
  tear.style.width=(p*100)+'%';
  pack.style.animation = p>0 ? 'none' : '';
}
function openPack(){
  if(state!=='pack') return;
  state='opening';
  const dir=drag&&drag.dir||1; drag=null;
  packTop.style.setProperty('--dir', dir);
  packTop.classList.add('fly');
  const r=pack.getBoundingClientRect();
  sfx.rip(); vib([30,30,70]);
  flash('rgba(200,225,255,.9)', .7, 500);
  burst(r.left+r.width/2, r.top+r.height*.15, ['#ffffff','#bcd3ff','#ffe9a8','#7ec8ff'], 46, {speed:10, size:7, life:60});
  hint('', '');
  setTimeout(()=>{ pack.classList.add('drop'); sfx.swoosh(); }, 380);
  setTimeout(dealCards, 650);
}

// ---------- cards ----------
const BACK = `<div class="back-in">
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="rgba(255,255,255,.06)" stroke="currentColor" stroke-width="3"/>
  <path d="M24 16 Q44 50 24 84" fill="none" stroke="#ff6b7a" stroke-width="2.6" stroke-dasharray="4 3"/>
  <path d="M76 16 Q56 50 76 84" fill="none" stroke="#ff6b7a" stroke-width="2.6" stroke-dasharray="4 3"/></svg>
  <div class="back-t">CHAMPIONS</div><div class="back-s">2026 PLAYER CARD</div></div>`;

function faceHTML(p){
  const st=p.stats.map(([l,v])=>`<div class="st"><b>${v}</b><span>${l}</span></div>`).join('');
  return `<div class="cf r-${p.rank}" style="--rk:${RK[p.rank].c}">
    <div class="cf-top"><div class="badge">${p.rank}</div><div class="ovr"><span>OVR</span><b>${p.ovr}</b></div></div>
    <div class="art"><div class="stripes"></div>
      <svg class="jersey" viewBox="0 0 200 180" aria-hidden="true">
        <path class="j-body" d="M62 14 L36 22 L6 48 L26 84 L46 74 L46 172 L154 172 L154 74 L174 84 L194 48 L164 22 L138 14 Q100 40 62 14 Z"/>
        <path class="j-shade" d="M100 30 L154 74 L154 172 L100 172 Z"/>
        <path class="j-trim" d="M62 14 Q100 40 138 14 M8 52 L26 84 M192 52 L174 84"/>
        <text class="j-name" x="100" y="72">${p.name}</text>
        <text class="j-num" x="100" y="${p.no?152:140}">${p.no||'-'}</text>
      </svg>
      <div class="pos">${p.pos}</div>
      ${p.titles.length?`<div class="titles">${p.titles.map(t=>`<span>${t}</span>`).join('')}</div>`:''}
    </div>
    <div class="nm"><div class="name">${p.name}</div><div class="sub">${p.tag?p.tag+', ':''}2026 정규시즌 ${p.G}경기</div></div>
    <div class="stats">${st}</div>
    <div class="foot">${p.hl}</div>
    <div class="holo"></div><div class="glare"></div>
  </div>`;
}

function rollRank(){
  let r=Math.random()*100;
  for(const k of ['S','A','B','C']){ if((r-=RK[k].w)<0) return k; }
  return 'C';
}
function drawPack(){
  const out=[], used=new Set();
  for(let i=0;i<5;i++){
    let r=rollRank();
    if(i===4 && out.every(p=>p.rank==='C')) r='B';
    let pool=PLAYERS.filter(p=>p.rank===r && !used.has(p.id));
    if(!pool.length) pool=PLAYERS.filter(p=>!used.has(p.id));
    const p=pool[Math.random()*pool.length|0]; used.add(p.id); out.push(p);
  }
  return out.sort((a,b)=>RK[a.rank].v-RK[b.rank].v || a.ovr-b.ovr); // 가장 좋은 카드가 마지막
}

let cards=[], idx=0, pulled=[], g=null;
const stackT = k => `translateY(${k*7}px) scale(${1-k*.035})`;

function dealCards(){
  state='reveal'; pulled=drawPack(); idx=0; deck.innerHTML='';
  cards = pulled.map((p,i)=>{
    const el=document.createElement('div');
    el.className='card'; el.style.setProperty('--rk',RK[p.rank].c);
    el.innerHTML=`<div class="tilt" style="animation-delay:${(pulled.length-1-i)*70}ms"><div class="flip"><div class="face back g-${p.rank}">${BACK}</div><div class="face front">${faceHTML(p)}</div></div></div>`;
    const c={el,p,flipped:false,busy:false,tilt:el.querySelector('.tilt'),cf:el.querySelector('.front .cf')};
    el.addEventListener('pointerdown', e=>onDown(e,c));
    el.addEventListener('pointermove', e=>onMove(e,c));
    el.addEventListener('pointerup', e=>onUp(e,c));
    el.addEventListener('pointercancel', e=>onUp(e,c,true));
    el.addEventListener('pointerleave', e=>{ if(!g && e.pointerType==='mouse') resetTilt(c); });
    deck.appendChild(el);
    return c;
  });
  layout();
}
function layout(){
  cards.forEach((c,i)=>{
    const k=i-idx; if(k<0) return;
    c.el.style.zIndex=50-k; c.el.style.transform=stackT(k);
    c.el.classList.toggle('top',k===0); c.el.style.pointerEvents=k===0?'auto':'none';
  });
  counter.textContent = idx<cards.length ? `${idx+1}/${cards.length}` : '';
  const c=cards[idx];
  if(c) hint(c.flipped ? '위로 밀거나 탭하면 다음 카드' : '탭해서 카드 뒤집기', c.flipped ? '↑' : '');
}
function holo(c,e){
  const r=c.el.getBoundingClientRect();
  const px=clamp((e.clientX-r.left)/r.width,0,1), py=clamp((e.clientY-r.top)/r.height,0,1);
  c.cf.style.setProperty('--mx',(px*100)+'%'); c.cf.style.setProperty('--my',(py*100)+'%');
  c.tilt.style.transform=`rotateX(${(.5-py)*18}deg) rotateY(${(px-.5)*22}deg)`;
}
function resetTilt(c){ c.tilt.style.transform=''; c.cf.style.setProperty('--mx','50%'); c.cf.style.setProperty('--my','50%'); }

function onDown(e,c){
  if(c!==cards[idx] || c.busy) return;
  audio();
  c.el.setPointerCapture(e.pointerId);
  g={x:e.clientX,y:e.clientY,mode:null,moved:0};
  if(c.flipped){ c.el.style.transition='none'; holo(c,e); }
}
function onMove(e,c){
  if(c!==cards[idx]) return;
  if(!g){ if(c.flipped && e.pointerType==='mouse') holo(c,e); return; }
  const dx=e.clientX-g.x, dy=e.clientY-g.y;
  g.moved=Math.max(g.moved,Math.hypot(dx,dy));
  if(!c.flipped) return;
  if(!g.mode && g.moved>14) g.mode=(dy<0 && Math.abs(dy)>Math.abs(dx)*1.2)?'swipe':'rub';
  if(g.mode==='swipe') c.el.style.transform=`translateY(${Math.min(0,dy)}px) rotate(${dx*.04}deg)`;
  holo(c,e);
}
function onUp(e,c,cancel){
  if(!g || c!==cards[idx]) { g=null; return; }
  const dy=e.clientY-g.y, gg=g; g=null;
  c.el.style.transition='';
  if(!c.flipped){ if(!cancel && gg.moved<18) reveal(c); return; }
  resetTilt(c);
  if(!cancel && ((gg.mode==='swipe' && dy<-70) || gg.moved<10)) away(c);
  else c.el.style.transform=stackT(0);
}

function reveal(c){
  c.busy=true;
  const r=c.p.rank, pre = r==='S' ? 1150 : r==='A' ? 560 : 0;
  let iv=0;
  if(pre){
    c.el.classList.add('charge'); sfx.charge(pre);
    vib(r==='S' ? [25,50,25,50,25,50,25,50,60] : [25,60,40]);
    hint(r==='S' ? '어? 뭔가 온다…' : '반짝인다!', '');
    iv=setInterval(()=>{
      const b=c.el.getBoundingClientRect();
      const side=Math.random()*4|0, t=Math.random();
      const x = side<2 ? b.left+t*b.width : (side===2?b.left:b.right);
      const y = side<2 ? (side===0?b.top:b.bottom) : b.top+t*b.height;
      burst(x,y, r==='S'?RAINBOW:['#ffcf4a','#fff3b8'], r==='S'?4:2, {speed:3.5, g:-.03, life:45, kind:'spark'});
    }, 50);
  }
  setTimeout(()=>{
    clearInterval(iv);
    c.el.classList.remove('charge');
    c.flipped=true; c.el.classList.add('flipped'); sfx.flip(); vib(15);
    setTimeout(()=>payoff(c), 300);
    setTimeout(()=>{ c.busy=false; layout(); }, 450);
  }, pre);
}
function payoff(c){
  const b=c.el.getBoundingClientRect(), x=b.left+b.width/2, y=b.top+b.height/2, r=c.p.rank;
  if(r==='S'){
    flash('rgba(255,170,230,.95)', 1, 900); shake(10); sfx.S(); vib([70,40,140]);
    burst(x,y,RAINBOW,150,{speed:13,size:8,life:90});
    setTimeout(()=>burst(x,b.top,RAINBOW,60,{speed:9,angle:-Math.PI/2,spread:2.2,size:7,life:80}),180);
  } else if(r==='A'){
    flash('rgba(255,210,90,.7)', .8, 600); shake(5); sfx.A(); vib([40,30,80]);
    burst(x,y,['#ffcf4a','#fff3b8','#ffffff','#e0a92c'],80,{speed:11,size:7,life:75});
  } else if(r==='B'){
    sfx.B(); burst(x,y,['#8fb4ff','#d9e6ff','#ffffff'],26,{speed:7,size:5,life:55});
  }
}
function away(c){
  c.busy=true;
  c.el.style.transition='transform .45s cubic-bezier(.5,0,.8,.3), opacity .45s';
  c.el.style.transform='translateY(-115vh) rotate(-10deg)'; c.el.style.opacity='0';
  sfx.swoosh(); vib(10);
  idx++; layout();
  setTimeout(()=>c.el.remove(), 480);
  if(idx>=cards.length) setTimeout(showResult, 320);
}

// ---------- result ----------
function showResult(){
  state='result'; hint('', ''); counter.textContent='';
  let newCount=0;
  pulled.forEach(p=>{ if(!dex[p.id]) newCount++; dex[p.id]=(dex[p.id]||0)+1; });
  saveDex(); updateDexBtn();
  const best=pulled[pulled.length-1];
  const n=pulled.length, mw=Math.min(innerWidth*.28,124);
  const fan=pulled.map((p,i)=>{
    const k=i-(n-1)/2;
    return `<button class="mini" data-id="${p.id}" aria-label="${p.name} 크게 보기" style="transform:translateX(${k*mw*.52}px) translateY(${Math.abs(k)*7}px) rotate(${k*7}deg);z-index:${i};animation-delay:${i*80}ms">${faceHTML(p)}</button>`;
  }).join('');
  result.innerHTML=`<h2>이번 팩 결과</h2>
    <div class="best">최고 등급 ${best.rank} · ${best.name}${newCount?` · 새 카드 ${newCount}장`:''}</div>
    <div class="fan">${fan}</div>
    <div class="actions"><button class="btn primary" id="again">한 팩 더 까기</button><button class="btn" id="toDex">도감 보기</button></div>`;
  result.hidden=false;
  result.querySelectorAll('.mini').forEach(m=>m.addEventListener('click',()=>openZoom(+m.dataset.id)));
  $('again').addEventListener('click', resetPack);
  $('toDex').addEventListener('click', openDex);
}
function resetPack(){
  result.hidden=true; deck.innerHTML=''; cards=[];
  pack.classList.remove('drop'); packTop.classList.remove('fly','snap');
  packTop.style.transform=''; tear.style.width='0'; pack.style.animation='';
  void pack.offsetWidth;
  pack.animate([{transform:'translateY(60vh) scale(.8)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{duration:550,easing:'cubic-bezier(.2,.9,.3,1.15)'});
  state='pack'; hint('팩 윗부분을 옆으로 쭉 밀어서 찢기','→');
}

// ---------- dex + zoom ----------
function openDex(){
  $('dexSub').textContent=`${dexCount()} / ${PLAYERS.length}장 모음 · 이 기기에만 저장돼요`;
  const order=[...PLAYERS].sort((a,b)=>b.ovr-a.ovr);
  $('dexGrid').innerHTML=order.map(p=> dex[p.id]
    ? `<button class="dexitem" data-id="${p.id}" aria-label="${p.name} 크게 보기">${faceHTML(p)}<span class="cnt">×${dex[p.id]}</span></button>`
    : `<div class="dexitem locked">?</div>`).join('');
  $('dexGrid').querySelectorAll('button.dexitem').forEach(b=>b.addEventListener('click',()=>openZoom(+b.dataset.id)));
  $('dex').hidden=false;
}
$('dexBtn').addEventListener('click', openDex);
$('dexClose').addEventListener('click', ()=>{ $('dex').hidden=true; });

const zoom=$('zoom'), zc=$('zoomcard');
function openZoom(id){
  const p=PLAYERS.find(x=>x.id===id); if(!p) return;
  zc.innerHTML=faceHTML(p); zoom.hidden=false; zc.style.transform='';
  zc.animate([{transform:'scale(.6) rotateY(90deg)',opacity:0},{transform:'scale(1) rotateY(0)',opacity:1}],{duration:420,easing:'cubic-bezier(.2,.9,.3,1.2)'});
}
function zoomHolo(e){
  const r=zc.getBoundingClientRect(), cf=zc.querySelector('.cf'); if(!cf) return;
  const px=clamp((e.clientX-r.left)/r.width,0,1), py=clamp((e.clientY-r.top)/r.height,0,1);
  cf.style.setProperty('--mx',(px*100)+'%'); cf.style.setProperty('--my',(py*100)+'%');
  zc.style.transform=`perspective(1000px) rotateX(${(.5-py)*18}deg) rotateY(${(px-.5)*22}deg)`;
}
zc.addEventListener('pointerdown', e=>{ zc.setPointerCapture(e.pointerId); zoomHolo(e); });
zc.addEventListener('pointermove', zoomHolo);
zc.addEventListener('pointerup', ()=>{ zc.style.transform=''; });
zoom.addEventListener('click', e=>{ if(!zc.contains(e.target)) zoom.hidden=true; });

hint('팩 윗부분을 옆으로 쭉 밀어서 찢기','→');
})();
</script>
